# SPDX-License-Identifier: Apache-2.0
# Task runner (https://taskfile.dev). Run `task --list` for the commands.
# Stubs are filled in by the Phase 0 tasks noted next to them (docs/plan.md §4).
version: '3'

vars:
  BINARY: bin/livesubs
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X main.version={{.VERSION}}
  SPEC: api/openapi.yaml
  # Go server port in dev; `task dev PORT=18080` if 8080 is taken.
  PORT: '{{.PORT | default "8080"}}'
  # Redocly runs through pinned npx; the other Node tools are web/ devDependencies.
  REDOCLY: npx --yes @redocly/cli@2.54.2
  PRISM: npx --yes @stoplight/prism-cli@5.16.0
  # air stays out of go.mod: as a `go tool` it pulls in Hugo and bumps shared deps.
  AIR: go run github.com/air-verse/air@v1.67.4
  # Every file `task gen` writes; check:gen fails if regenerating changes any of them.
  GENERATED: >-
    internal/api/gen.go internal/api/unimplemented_gen.go
    web/src/api/schema.d.ts web/src/routeTree.gen.ts web/src/theme/palette.ts

tasks:
  default:
    cmds:
      - task --list
    silent: true

  dev:
    desc: Go server (air) + Vite (HMR) together; open http://localhost:5173 (PORT=… moves the Go server)
    deps: [dev:server, dev:web]

  dev:ai:
    desc: 'Local-provider sidecars in Docker: whisper-server :8178 + ollama :11434 (GPU=1 for NVIDIA, SERVICES=whisper for one)'
    cmds:
      - >-
        docker compose -f deploy/compose/compose.dev.yaml
        {{if .GPU}}-f deploy/compose/compose.gpu.yaml{{end}}
        up -d {{.SERVICES}}

  dev:ai:down:
    desc: Stop the local-provider sidecars
    cmds:
      - docker compose -f deploy/compose/compose.dev.yaml down

  models:pull:
    desc: 'Download the default local models (WHISPER_MODEL, GEMMA_MODEL override)'
    cmds:
      - scripts/pull-models.sh

  audio:fetch:
    desc: Download and trim the EN/ES Nerdearla test clips into testdata/audio/
    cmds:
      - scripts/fetch-test-audio.sh

  design:preview:
    desc: Open design/preview.html in the browser
    cmds:
      - '{{if eq OS "darwin"}}open{{else}}xdg-open{{end}} design/preview.html'

  dev:web:
    desc: 'Vite dev server with HMR on :5173 (API=mock uses the Prism mock instead of the Go server)'
    deps: [web:install]
    dir: web
    env:
      VITE_API: '{{.API | default "server"}}'
      VITE_API_TARGET: 'http://localhost:{{.PORT}}'
    cmds:
      - pnpm -s dev {{.CLI_ARGS}}

  dev:mock:
    desc: Prism mock of api/openapi.yaml on :4010 (pair with `task dev:web API=mock`)
    cmds:
      - '{{.PRISM}} mock {{.SPEC}} --host 0.0.0.0 --port 4010'

  dev:server:
    desc: Go server with live reload (air)
    env:
      LIVESUBS_ADDR: ':{{.PORT}}'
      LIVESUBS_LOG_LEVEL: '{{.LIVESUBS_LOG_LEVEL | default "debug"}}'
    cmds:
      - '{{.AIR}} -c .air.toml'

  gen:
    desc: Regenerate Go + TS code from the OpenAPI spec, and palette.ts from tokens.css
    cmds:
      - task: gen:go
      - task: gen:ts
      - task: gen:routes
      - task: gen:palette

  gen:go:
    desc: Go types + strict server (internal/api/gen.go) and NotImplemented defaults
    sources: ['{{.SPEC}}', api/oapi-codegen.yaml, scripts/gen-unimplemented.py]
    generates: [internal/api/gen.go, internal/api/unimplemented_gen.go]
    cmds:
      - go tool oapi-codegen -config api/oapi-codegen.yaml {{.SPEC}}
      - python3 scripts/gen-unimplemented.py

  gen:ts:
    desc: TS types (web/src/api/schema.d.ts)
    deps: [web:install]
    sources: ['{{.SPEC}}']
    generates: [web/src/api/schema.d.ts]
    dir: web
    cmds:
      - pnpm -s gen:api --silent

  gen:routes:
    desc: TanStack Router route tree (web/src/routeTree.gen.ts)
    deps: [web:install]
    sources: [web/src/routes/**/*]
    generates: [web/src/routeTree.gen.ts]
    dir: web
    cmds:
      - pnpm -s gen:routes 2>/dev/null

  gen:palette:
    desc: palette.ts (sRGB hex) from tokens.css (OKLCH)
    sources: [web/src/theme/tokens.css, scripts/gen-palette.py]
    generates: [web/src/theme/palette.ts]
    cmds:
      - python3 scripts/gen-palette.py

  check:
    desc: Everything CI runs (lint, typecheck, tests, spec lint, codegen drift, SPDX…)
    cmds:
      - task: check:spdx
      - task: check:spec
      - task: check:gen
      - task: check:go
      - task: check:web
      - task: test

  check:spec:
    desc: Lint the OpenAPI spec with Redocly
    cmds:
      - '{{.REDOCLY}} lint {{.SPEC}}'

  check:gen:
    desc: Fail if generated code is out of date with its sources
    cmds:
      - cmd: |
          before=$(shasum {{.GENERATED}} 2>/dev/null)
          task gen --force --silent
          after=$(shasum {{.GENERATED}})
          if [ "$before" != "$after" ]; then
            echo "generated code was stale; commit the output of 'task gen':"
            git status --short -- {{.GENERATED}}
            exit 1
          fi
        silent: true

  check:spdx:
    desc: Fail on source files without the Apache-2.0 SPDX header
    cmds:
      - python3 scripts/check-spdx.py

  check:go:
    desc: gofmt and go vet
    cmds:
      - cmd: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; echo "run gofmt -w on the files above"; exit 1; }
        silent: true
      - go vet ./...

  check:web:
    desc: ESLint, Prettier, TypeScript and i18n key parity for web/
    deps: [web:install]
    dir: web
    cmds:
      - pnpm -s lint
      - pnpm -s format:check
      - pnpm -s typecheck
      - pnpm -s check:i18n

  test:
    desc: Go tests (with -race) and web tests (Vitest)
    cmds:
      - task: test:go
      - task: test:web

  test:go:
    cmds:
      - go test -race ./...

  test:web:
    deps: [web:install]
    dir: web
    cmds:
      - pnpm -s test

  web:install:
    desc: Install web dependencies
    dir: web
    sources: [package.json, pnpm-lock.yaml]
    status:
      - test -d node_modules
    cmds:
      - pnpm install --frozen-lockfile

  web:build:
    desc: Build the web app into web/dist (embedded by the Go binary)
    deps: [web:install]
    dir: web
    cmds:
      - pnpm -s build

  build:
    desc: Build a single binary for the host platform ({{.BINARY}})
    env:
      CGO_ENABLED: '0'
    cmds:
      - task: web:build
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.BINARY}} ./cmd/livesubs
